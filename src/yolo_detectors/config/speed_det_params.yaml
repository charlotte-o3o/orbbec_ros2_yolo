fine_tune_yolo_node:
    ros__parameters:
        model_path: 'weights/alien_plushie_v5.pt'
        confidence: 0.50
        max_history: 5
        max_jump: 2.0
        bb_margin: 0.46
        # Camera is mounted rotated; straighten the frame for inference only.
        # 0 = level, 90/180/270 = counter-clockwise rotation applied before YOLO.
        input_rotation_deg: 90

yolo_pose_node:
    ros__parameters:
        model_path: 'weights/yolo26n-pose.pt'
        confidence: 0.50

speed_det_node:
    ros__parameters:
        save_distance_mode: false
        record_mode: True
        annotations_mode: true
        alpha_smooth: 0.4
        cooldown_duration: 5.0
        speed_threshold: 1.5
        startup_grace_period: 8.0
        landing_z_threshold: 0.3
        # Hand-measured mounting angles -- the sole source of the camera->world rotation.
        # Physical mount is roll -90, pitch -30 per orbbec_ros2/.env, but the sign
        # convention there is the camera BODY frame, not the optical one, so these are
        # the values calibrated against the optical frame.
        camera_tilt_deg: -15.0
        camera_roll_deg: -90.0

        # Real gravity. Was 8.0 to compensate for a camera->world matrix that was not a
        # rotation (det = cos(2*tilt)) and under-read vertical motion. That matrix is now
        # a proper rotation, so this is the true value.
        effective_gravity: 9.81

        # World -> robot transform, read from TF once at startup. world_frame_id must match
        # the child_frame_id of the TF you publish; robot_frame_id is its parent, and is the
        # frame the capture box below and the /reach_command target are expressed in.
        robot_frame_id: torso_link
        world_frame_id: orbbec_external_link
        tf_lookup_timeout: 10.0

        # Gripper opening sent in the reach command packet.
        reach_aperture: 0.15

        # Robot capture box, in ROBOT-frame metres (x forward, y left, z up). The axis
        # swaps you had noted are folded in: old x -> y, old y -> z, old z -> x.
        # NOTE: the extents are carried over, but the origin moved from the camera to the
        # robot, so these still need re-measuring against the robot's actual reach.
        capture_box_x_min: 0.20
        capture_box_x_max: 0.40
        capture_box_y_min: -0.12
        capture_box_y_max: 0.12
        capture_box_z_min: 0.00
        capture_box_z_max: 0.40
