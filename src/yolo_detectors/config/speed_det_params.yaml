fine_tune_yolo_node:
    ros__parameters:
        model_path: 'weights/alien_plushie_v5.pt'
        confidence: 0.50
        max_history: 5
        max_jump: 2.0
        bb_margin: 0.46
        # Camera is mounted rotated; straighten the frame for inference only.
        # 0 = level, 90/180/270 = counter-clockwise rotation applied before YOLO.
        input_rotation_deg: 90

yolo_pose_node:
    ros__parameters:
        model_path: 'weights/yolo26n-pose.pt'
        confidence: 0.50

speed_det_node:
    ros__parameters:
        save_distance_mode: false
        record_mode: True
        annotations_mode: true
        alpha_smooth: 0.4
        cooldown_duration: 5.0
        speed_threshold: 1.5
        startup_grace_period: 8.0
        landing_z_threshold: 0.3
        # The world frame is derived from the camera's own IMU gravity vector, averaged over
        # the startup_grace_period and then frozen. Set to 'params' to fall back to the
        # hand-measured angles below.
        orientation_source: imu
        imu_topic: /orbbec_external/gyro_accel/sample
        imu_optical_frame: orbbec_external_color_optical_frame

        # Fallback only (orientation_source: params). Physical mount is roll -90, pitch -30
        # per orbbec_ros2/.env, but the sign convention there is the camera BODY frame, not
        # the optical one, so these need confirming against the IMU-derived values logged
        # at startup before being relied on.
        camera_tilt_deg: 15.0
        camera_roll_deg: -90.0

        # Real gravity. Was 8.0 to compensate for a camera->world matrix that was not a
        # rotation (det = cos(2*tilt)) and under-read vertical motion. That matrix is fixed
        # and the frame is now gravity-aligned by construction, so this is the true value.
        effective_gravity: 9.81

        # Robot capture box, world-frame metres. Tuned against the old sheared frame --
        # expect to re-tune now that the geometry is corrected.
        capture_box_x_min: -1.0
        capture_box_x_max: 1.0
        capture_box_y_min: -1.0
        capture_box_y_max: 1.0
        capture_box_z_min: 0.0
        capture_box_z_max: 0.2
